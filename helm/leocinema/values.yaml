createDb: false         # DB is managed by Terraform (RDS)
managedByTerraform: true # Secret + ConfigMap managed by Terraform modules/kubernetes
ingressEnabled: true    # backend ingress
frontendEnabled: false  # frontend runs on S3+CloudFront, not in Kubernetes
nodeSelectorEnabled: false

ingressIp: ""           # set via ArgoCD helm parameter

# Theme of this release (red | green | blue), set via ArgoCD helm parameter.
# All themes share one NGINX Ingress controller, so each backend Ingress is
# published under its own path prefix: /<theme>/api/...  CloudFront adds the
# prefix through the origin_path of the API origin (see modules/s3-cloudfront).
# Leave empty for local dev: the Ingress then serves plain /api/...
theme: ""

# Prometheus metrics. The backend serves /metrics on its own port (never
# routed by the Ingress). serviceMonitor needs the Prometheus Operator CRDs
# (installed by the `monitoring` Application), so it is off by default and
# switched on by Terraform through an ArgoCD helm parameter.
metrics:
  port: 9091
  serviceMonitor:
    enabled: false
    interval: 15s

db:
  image: bitnami/mariadb:latest
  servicePort: 3306
  minReplicas: 1
  maxReplicas: 3
  averageUtilization: 70
  requests:
    storage: 1Gi

backend:
  image: leobgs/leocinema-backend:argocd
  servicePort: 80
  pullPolicy: IfNotPresent
  minReplicas: 2
  maxReplicas: 6
  averageUtilization: 70
  requests:
    cpu: "100m"
    memory: "200Mi"

# frontend block kept for local dev (frontendEnabled: true)
frontend:
  image: leobgs/leocinema-frontend:red
  servicePort: 80
  pullPolicy: IfNotPresent
  minReplicas: 2
  maxReplicas: 6
  averageUtilization: 70
  requests:
    cpu: "100m"
    memory: "200Mi"

# env block used only when createDb: true (local dev with in-cluster MariaDB)
# In production these values come from the Kubernetes Secret managed by Terraform.
env:
  mariadb_root_password: ""
  db_host: ""
  db_database: ""
  db_user: ""
  db_password: ""
