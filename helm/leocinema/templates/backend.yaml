apiVersion: v1
kind: Service
metadata:
  name: {{ include "leocinema.name" . }}-backend-svc
  labels:
    app: {{ include "leocinema.name" . }}-backend
    {{- if .Values.theme }}
    theme: {{ .Values.theme | quote }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.servicePort }}
      targetPort: 3333
    # Scraped by Prometheus (ServiceMonitor). The Ingress only routes the
    # `http` port above, so /metrics is never reachable from the internet.
    - name: metrics
      protocol: TCP
      port: {{ .Values.metrics.port }}
      targetPort: metrics
  selector:
    app: {{ include "leocinema.name" . }}-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leocinema.name" . }}-backend-dep
  labels:
    app: {{ include "leocinema.name" . }}-backend
spec:
  # No `replicas` here on purpose: the HPA below owns the replica count.
  # A fixed value would make ArgoCD (selfHeal) reset the Deployment to
  # minReplicas on every sync and fight the autoscaler. The HPA starts
  # the Deployment at minReplicas.
  strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 25%
        maxSurge: 25%
  selector:
    matchLabels:
      app: {{ include "leocinema.name" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "leocinema.name" . }}-backend
    spec:
      {{- if .Values.nodeSelectorEnabled }}
      nodeSelector:
        tier: "app"
      {{- end }}
      containers:
        - name: leocinema
          image: "{{ .Values.backend.image }}"
          livenessProbe:
            httpGet:
              path: /health
              port: 3333
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - name: http
              containerPort: 3333
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          env:
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "leocinema.name" . }}-secrets
                  key: DB_HOST
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "leocinema.name" . }}-secrets
                  key: DB_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "leocinema.name" . }}-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "leocinema.name" . }}-secrets
                  key: DB_PASSWORD
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "leocinema.name" . }}-configmap
                  key: FRONTEND_URL
          resources:
            requests:
              cpu: {{ .Values.backend.requests.cpu }}
              memory: {{ .Values.backend.requests.memory }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "leocinema.name" . }}-backend-hpa
spec:
  maxReplicas: {{ .Values.backend.maxReplicas }}
  minReplicas: {{ .Values.backend.minReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "leocinema.name" . }}-backend-dep
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.averageUtilization }}
{{- if .Values.ingressEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "leocinema.name" . }}-backend-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host:
      http:
        paths:
          - path: {{ if .Values.theme }}/{{ .Values.theme }}{{ end }}/api/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "leocinema.name" . }}-backend-svc
                port:
                  number: {{ .Values.backend.servicePort }}
{{- end }}
