{{/*
  env.yaml — ConfigMap and Secret for the application.

  When managedByTerraform=true (default in production):
    - Neither the ConfigMap nor the Secret is created by Helm.
    - Both are managed by modules/kubernetes in Terraform,
      which injects the correct RDS hostname, database name,
      credentials and CloudFront URLs.

  When managedByTerraform=false (local dev):
    - Both resources are created by Helm using values.yaml.
*/}}
{{- if not .Values.managedByTerraform }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leocinema.name" . }}-configmap
data:
  FRONTEND_URL: "http://{{ .Values.ingressIp }}"
  BACKEND_URL: "{{ .Values.ingressIp }}/api/comprar-ingresso"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leocinema.name" . }}-secrets
type: Opaque
data:
  DB_HOST: {{ .Values.env.db_host | b64enc | quote }}
  {{- if .Values.createDb }}
  MARIADB_ROOT_PASSWORD: {{ .Values.env.mariadb_root_password | b64enc | quote }}
  {{- end }}
  DB_DATABASE: {{ .Values.env.db_database | b64enc | quote }}
  DB_USER: {{ .Values.env.db_user | b64enc | quote }}
  DB_PASSWORD: {{ .Values.env.db_password | b64enc | quote }}
{{- end }}
