apiVersion: v1
kind: Namespace
metadata:
  name: leocinema
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: leocinema-configmap
  namespace: leocinema
data:
  FRONTEND_URL: "http://127.0.0.1"
  BACKEND_URL: "127.0.0.1/api/comprar-ingresso"
---
apiVersion: v1
kind: Secret
metadata:
  name: leocinema-secrets
  namespace: leocinema
type: Opaque
# Lab-only DEMO values (stringData: plain text, Kubernetes encodes it).
# Replace them before using these manifests anywhere but a throwaway cluster.
stringData:
  DB_HOST: mariadb-leocinema-svc
  MARIADB_ROOT_PASSWORD: demo-root-password
  MARIADB_DATABASE: leocinemadb
  MARIADB_USER: leocinema
  MARIADB_PASSWORD: demo-password
